name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make test
      - run: make dist
      - run: scripts/verify-dist.sh

  # Installs the real installer on a real systemd host, uses it the way the app
  # does, then uninstalls it.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Server unit tests on Python 3.10, the oldest supported
        run: python3 -m unittest
        working-directory: server
      - run: make installer
      - name: Install as root with the sudoers rule for runner
        run: |
          out=$(sudo sh build/dist/vpsmon-install.sh --user runner)
          echo "$out"
          python3 -c 'import json, sys
          r = json.loads(sys.argv[1])
          assert r["ok"] and r["version"] == sys.argv[2] and r["changed"], r' "$out" "$(cat VERSION)"
          sudo visudo -cf /etc/sudoers.d/vpsmon
          sudo cat /etc/sudoers.d/vpsmon
      - name: Status as runner, elevated by vpsmon itself
        run: |
          test "$(id -un)" = runner
          vpsmon status >"$RUNNER_TEMP/status.json"
          python3 server/check_contract.py "$RUNNER_TEMP/status.json"
          vpsmon --lang es status >"$RUNNER_TEMP/status-es.json"
          python3 server/check_contract.py "$RUNNER_TEMP/status-es.json"
      - name: Scan, then status again
        run: |
          vpsmon scan
          vpsmon status >"$RUNNER_TEMP/status-scanned.json"
          python3 server/check_contract.py "$RUNNER_TEMP/status-scanned.json"
      - name: Rerunning the installer changes nothing
        run: |
          out=$(sudo sh build/dist/vpsmon-install.sh --user runner)
          echo "$out"
          python3 -c 'import json, sys
          r = json.loads(sys.argv[1])
          assert r["ok"] and r["changed"] == [], r' "$out"
      - name: Uninstall removes the script and the sudoers rule
        run: |
          sudo vpsmon uninstall
          # /etc/sudoers.d is not readable by runner, so test as root.
          sudo test ! -e /usr/local/bin/vpsmon
          sudo test ! -e /etc/sudoers.d/vpsmon

  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSLo "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
